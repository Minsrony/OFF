/* ============ GAMES: Tower, Small pleasures (plinko), Connect the stars, Sloth noughts and crosses, Pairs ============
   Soft goals, no scores, no failing. Everything is drawn and synthesised locally, so all of it works offline. */

const hsl=(hh,ss,ll,aa)=>'hsla('+Math.round(((hh%360)+360)%360)+','+ss+'%,'+ll+'%,'+(aa==null?1:aa)+')';
function rrect(c,x,y,w,hh,r){
  r=Math.max(0,Math.min(r,w/2,hh/2));
  c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+hh,r); c.arcTo(x+w,y+hh,x,y+hh,r); c.arcTo(x,y+hh,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
const GFONT='"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif';
const PENTA=[523.3,587.3,659.3,784,880,1046.5,1174.7,1318.5];

/* ---------------- Tower ---------------- */
function Tower({say}){
  const setup=useCallback(api=>{
    const LINES={4:'A tower. Look at you.',9:'Nobody asked for this to be taller.',16:'Structurally questionable. Aesthetically fine.',25:'This has stopped being sensible.',40:'The tower has developed opinions.'};
    const FALL=['Gravity wins. It always does.','The tower has been lovely.','Nobody saw that.','That counts as modern art.'];
    let W=0,H=0,s=1,bh=30,gy=0,baseW=0,stack=[],cur=null,cam=0,pieces=[],rings=[],count=0,perfect=0,over=-1,hue0=rnd(0,360),dir=1;
    function spawn(){const top=stack[stack.length-1]; dir=Math.random()<.5?1:-1; cur={w:top.w,x:dir>0?-top.w*.6:W-top.w*.4,i:stack.length};}
    function reset(){hue0=rnd(0,360); count=0; perfect=0; over=-1; pieces=[]; rings=[]; cam=0; stack=[{x:W/2-baseW/2,w:baseW,i:0}]; spawn();}
    const by=i=>gy-(i+1)*bh-cam;
    function block(c,x,y,w,i,al){
      const hue=hue0+i*11; w=Math.max(2,w);
      c.globalAlpha=al==null?1:al;
      c.fillStyle='rgba(60,40,90,.16)'; rrect(c,x+3,y+5,w,bh-1,7*s); c.fill();
      const g=c.createLinearGradient(0,y,0,y+bh); g.addColorStop(0,hsl(hue,70,77)); g.addColorStop(1,hsl(hue+14,64,62));
      c.fillStyle=g; rrect(c,x,y,w,bh-1,7*s); c.fill();
      c.fillStyle='rgba(255,255,255,.38)'; rrect(c,x+3,y+2,Math.max(0,w-6),5*s,3*s); c.fill();
      c.globalAlpha=1;
    }
    return {
      resize(w,h){W=w;H=h;s=clamp(Math.min(w/400,h/700),.7,1.3);bh=30*s;gy=h-150;baseW=clamp(w*.45,120,260);reset();},
      down(){
        if(over>=0){ if(api.t-over>1) reset(); return; }
        if(!cur) return;
        const top=stack[stack.length-1], l=Math.max(cur.x,top.x), r=Math.min(cur.x+cur.w,top.x+top.w), ov=r-l;
        if(ov<=3*s){
          pieces.push({x:cur.x,w:cur.w,i:cur.i,y:0,vy:0,rot:0,vr:dir*1.4}); cur=null; over=api.t; perfect=0;
          Snd.thunk(); say(pick(FALL),5200); return;
        }
        if(Math.abs(cur.x-top.x)<=5*s){
          cur.x=top.x; perfect++; rings.push({i:cur.i,t:0}); Snd.chime(PENTA[Math.min(perfect-1,PENTA.length-1)]);
        } else {
          perfect=0;
          if(cur.x<top.x) pieces.push({x:cur.x,w:top.x-cur.x,i:cur.i,y:0,vy:0,rot:0,vr:-1.2});
          else pieces.push({x:top.x+top.w,w:cur.x+cur.w-(top.x+top.w),i:cur.i,y:0,vy:0,rot:0,vr:1.2});
          cur.x=l; cur.w=ov; Snd.thunk();
        }
        stack.push({x:cur.x,w:cur.w,i:cur.i}); count++; vib(6);
        if(LINES[count]) say(LINES[count],4800);
        spawn();
      },
      frame(c,w,h,t,dt){
        if(!stack.length) reset();
        const tint=count*3, g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,hsl(hue0+tint,70,91)); g.addColorStop(1,hsl(hue0+tint+50,68,83)); c.fillStyle=g; c.fillRect(0,0,w,h);
        const camT=Math.max(0,(stack.length+2)*bh-(gy-h*.34)); cam+=(camT-cam)*Math.min(1,dt*3);
        c.fillStyle='rgba(255,255,255,.55)';
        for(let i=0;i<5;i++){const x=((i*173+t*6)%(w+240))-120, y=(60+i*83+cam*.25)%(h*.7); c.beginPath(); c.arc(x,y,26*s,0,TAU); c.arc(x+30*s,y+6*s,20*s,0,TAU); c.arc(x-28*s,y+8*s,18*s,0,TAU); c.fill();}
        const gyc=gy-cam; if(gyc<h){c.fillStyle=hsl(hue0+210,28,72); c.fillRect(0,gyc,w,h-gyc); c.fillStyle='rgba(255,255,255,.35)'; c.fillRect(0,gyc,w,3*s);}
        for(const b of stack) block(c,b.x,by(b.i),b.w,b.i);
        for(let i=rings.length-1;i>=0;i--){const r=rings[i]; r.t+=dt; if(r.t>.6){rings.splice(i,1);continue;} const b=stack[r.i]; if(!b) continue; const k=r.t/.6; c.strokeStyle='rgba(255,255,255,'+(1-k)*.9+')'; c.lineWidth=3; rrect(c,b.x-k*10,by(r.i)-k*10,b.w+k*20,bh+k*20,8); c.stroke();}
        if(cur&&over<0){
          const sp=(150+Math.min(count,30)*6)*s; cur.x+=dir*sp*dt;
          if(cur.x>w-cur.w*.4) dir=-1; if(cur.x<-cur.w*.6) dir=1;
          block(c,cur.x,by(cur.i),cur.w,cur.i);
        }
        for(let i=pieces.length-1;i>=0;i--){
          const p=pieces[i]; p.vy+=1500*s*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
          if(p.y>h*1.3){pieces.splice(i,1);continue;}
          c.save(); c.translate(p.x+p.w/2,by(p.i)+bh/2+p.y); c.rotate(p.rot); block(c,-p.w/2,-bh/2,p.w,p.i,Math.max(0,1-p.y/(h*.9))); c.restore();
        }
        if(over>=0&&t-over>3.4) reset();
      }
    };
  },[]);
  return h(Stage,{setup});
}

/* ---------------- Plinko of small pleasures ---------------- */
function Plinko({say}){
  const setup=useCallback(api=>{
    const BINS=[['Nap','A nap. Take it.'],['Biscuit','One biscuit. Not two.'],['Sunbeam','A sunbeam on the floor. Stand in it.'],['Nothing','Nothing at all. The best prize.'],['Soup','Soup. Hot, with bread.'],['Hammock','A hammock. Currently unoccupied.'],['Nap','Another nap. Take that one too.']];
    const NB=BINS.length;
    let W=0,H=0,s=1,px0=0,pw=0,bw=0,top=0,binTop=0,floor=0,pegs=[],balls=[],pegR=4,ballR=8,glow=[],mx=null,lastSnd=0,drops=0;
    function build(w,hh){
      W=w;H=hh; s=clamp(Math.min(w/400,hh/700),.7,1.25); pw=Math.min(w-16,NB*64*s); px0=(w-pw)/2; bw=pw/NB;
      top=Math.max(90,hh*.17); floor=hh-150; binTop=floor-70*s; pegR=4*s; ballR=Math.min(bw*.17,9*s); pegs=[]; glow=new Array(NB).fill(0); balls=[];
      const rows=Math.max(5,Math.floor((binTop-top-30)/(bw*.78))), dy=(binTop-top-34)/rows;
      for(let r=0;r<rows;r++){
        const y=top+34+r*dy;
        if(r%2===0){for(let k=0;k<=NB;k++) pegs.push({x:px0+bw*k,y});}
        else{for(let k=0;k<NB;k++) pegs.push({x:px0+bw*(k+.5),y});}
      }
    }
    function drop(x){
      if(balls.filter(b=>!b.done).length>=10) return;
      const xx=clamp(x,px0+bw*.5,px0+pw-bw*.5);
      balls.push({x:xx+rnd(-1.5,1.5),y:top-8,vx:rnd(-4,4),vy:0,hue:rnd(0,360),rest:0,age:0,done:0,stuck:0});
      drops++; Snd.tap(); if(drops===1) say('Drop another. There is no limit that matters.',4800);
    }
    return {
      resize:build,
      down(x,y){mx=x; drop(x);},
      move(x){mx=x;},
      frame(c,w,hh,t,dt){
        const g=c.createLinearGradient(0,0,0,hh); g.addColorStop(0,'#2d1f55'); g.addColorStop(1,'#171030'); c.fillStyle=g; c.fillRect(0,0,w,hh);
        c.fillStyle='rgba(255,255,255,.5)'; for(let i=0;i<40;i++){const a=.3+.4*Math.sin(t*1.2+i); c.globalAlpha=a; c.fillRect((i*97)%w,(i*53)%(hh*.5),1.6,1.6);} c.globalAlpha=1;
        // bins
        for(let k=0;k<NB;k++){
          const x=px0+k*bw; glow[k]=Math.max(0,glow[k]-dt*1.2);
          c.fillStyle='rgba(255,255,255,'+(.05+(k%2)*.03+glow[k]*.35)+')'; c.fillRect(x,binTop,bw,floor-binTop);
          c.fillStyle='rgba(255,240,210,'+(.55+glow[k]*.45)+')'; c.font='600 '+Math.max(10,Math.round(11*s))+'px '+GFONT; c.textAlign='center';
          c.fillText(BINS[k][0],x+bw/2,floor-12*s);
        }
        c.strokeStyle='rgba(255,255,255,.28)'; c.lineWidth=2; c.beginPath(); for(let k=0;k<=NB;k++){const x=px0+k*bw; c.moveTo(x,binTop); c.lineTo(x,floor);} c.moveTo(px0,floor); c.lineTo(px0+pw,floor); c.stroke();
        // pegs
        for(const p of pegs){const gr=c.createRadialGradient(p.x,p.y,0,p.x,p.y,pegR*3); gr.addColorStop(0,'rgba(255,220,160,.35)'); gr.addColorStop(1,'rgba(255,220,160,0)'); c.fillStyle=gr; c.fillRect(p.x-pegR*3,p.y-pegR*3,pegR*6,pegR*6); c.fillStyle='#ffe6b8'; c.beginPath(); c.arc(p.x,p.y,pegR,0,TAU); c.fill();}
        // aim guide
        if(mx!=null){const gx=clamp(mx,px0+bw*.5,px0+pw-bw*.5); c.strokeStyle='rgba(255,255,255,.18)'; c.setLineDash&&c.setLineDash([4,6]); c.lineWidth=1.5; c.beginPath(); c.moveTo(gx,top-4); c.lineTo(gx,top+30); c.stroke(); c.setLineDash&&c.setLineDash([]); c.fillStyle='rgba(255,255,255,.3)'; c.beginPath(); c.arc(gx,top-8,ballR,0,TAU); c.fill();}
        // physics
        const sub=4, d=dt/sub;
        for(const b of balls){

          for(let n=0;n<sub;n++){
            b.vy+=1150*s*d; b.x+=b.vx*d; b.y+=b.vy*d;

function Stars({say}){
  const setup=useCallback(api=>{

function Sloth({say}){
  const setup=useCallback(api=>{
    const LN=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

      c.strokeStyle='#a98a62'; c.lineWidth=15; for(const d of [-1,1]){c.beginPath(); c.moveTo(d*38,-12); c.quadraticCurveTo(d*58,-48,d*40,-76); c.stroke();}
      c.strokeStyle='#e8dcc0'; c.lineWidth=3; for(const d of [-1,1]) for(let i=-1;i<=1;i++){c.beginPath(); c.moveTo(d*40+i*5,-80); c.lineTo(d*40+i*5+2,-70); c.stroke();}
      c.fillStyle='#a98a62'; c.beginPath(); c.ellipse(0,30,46,34,0,0,TAU); c.fill();
      const hg=c.createRadialGradient(-10,-18,4,0,0,56); hg.addColorStop(0,'#c9ad82'); hg.addColorStop(1,'#a58459'); c.fillStyle=hg; c.beginPath(); c.ellipse(0,0,50,42,0,0,TAU); c.fill();
      c.fillStyle='#ecdfbf'; c.beginPath(); c.ellipse(0,4,38,29,0,0,TAU); c.fill();
      c.fillStyle='#5d4730';
      for(const d of [-1,1]){c.save(); c.translate(d*17,-1); c.rotate(d*.55); c.beginPath(); c.ellipse(0,0,10,15,0,0,TAU); c.fill(); c.restore();}
      for(const d of [-1,1]){
        const ex=d*17, ey=-1;
        if(eyeOpen>.12){c.fillStyle='#f6efe0'; c.beginPath(); c.ellipse(ex,ey,5.4,5.4*eyeOpen,0,0,TAU); c.fill(); c.fillStyle='#1f160d'; c.beginPath(); c.ellipse(ex+d*.6,ey+.8,2.6,2.6*Math.min(1,eyeOpen*1.3),0,0,TAU); c.fill();}

          if(face){
            c.fillStyle=cd.matched?'#fff8ec':'#fffaf2'; rrect(c,-cw/2,-ch/2,cw,ch,cw*.12); c.fill();
            if(cd.glow>0){c.strokeStyle='rgba(255,200,90,'+cd.glow+')'; c.lineWidth=4; c.stroke();}
            icon(c,cd.k,0,0,cw*.27,COL[cd.k],cd.matched?'#fff8ec':'#fffaf2');
          } else {
            const bg=c.createLinearGradient(0,-ch/2,0,ch/2); bg.addColorStop(0,'#9a8ae0'); bg.addColorStop(1,'#7a69c4');
            c.fillStyle=bg; rrect(c,-cw/2,-ch/2,cw,ch,cw*.12); c.fill();
            c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=2; rrect(c,-cw/2+6,-ch/2+6,cw-12,ch-12,cw*.08); c.stroke();

/* ============ cloud: Supabase sync for My Box (offline-first) ============
   The browser keeps working copy in localStorage. Every change is also queued and sent to
   the off_box_items table under an anonymous Supabase session (no account, no sign-up).
   Row-level security means a session can only ever see its own rows. If Supabase is
   unreachable or anonymous sign-ins are off, the app simply keeps using local storage. */

const SB_URL='https://jeerscukwmcawmoddoax.supabase.co';
const SB_KEY='sb_publishable_JkOIq3bGF5fHrFLVFwfRNg_p19u-bcW';
const SB_TABLE='off_box_items';

const isUuid=s=>typeof s==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s);
const newId=()=>{
  try{ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16);});
};
const toRow=i=>({id:i.id,text:i.text,status:i.s,created_at:new Date(i.at||Date.now()).toISOString()});
const fromRow=r=>({id:r.id,text:r.text,s:r.status,at:Date.parse(r.created_at)||Date.now()});

const BoxSync=(function(){
  let session=store.get('off.sb.session',null);
  let queue=store.get('off.sb.queue',[]);
  if(!Array.isArray(queue)) queue=[];
  let busy=false, rev=0, state='idle', lastSync=0;
  const subs=new Set();

  function setState(s){ if(state!==s){ state=s; subs.forEach(f=>f(s)); } }
  function httpErr(res,body){ const e=new Error('HTTP '+res.status+' '+String(body||'').slice(0,160)); e.status=res.status; return e; }
  const saveQueue=()=>store.set('off.sb.queue',queue);
  const done=ops=>{ queue=queue.filter(q=>ops.indexOf(q)<0); };   // by identity: the queue may have changed while a request was in flight
  const stateFor=e=>(e&&e.status>=400&&e.status<500&&e.status!==408&&e.status!==429)?'unavailable':'offline';

  function saveSession(j){
    session={
      access_token:j.access_token, refresh_token:j.refresh_token,
      expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),
      user_id:(j.user&&j.user.id)||(session&&session.user_id)||null
    };
    store.set('off.sb.session',session);
  }
  async function authCall(path,body){
    const res=await fetch(SB_URL+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
    const txt=await res.text();
    if(!res.ok){ const e=httpErr(res,txt); e.auth=true; throw e; }
    return JSON.parse(txt);
  }
  async function signIn(){
    // Anonymous sign-in: same call supabase-js makes for signInAnonymously()
    saveSession(await authCall('/auth/v1/signup',{data:{},gotrue_meta_security:{}}));
  }
  async function ensure(){
    const now=Date.now()/1000;
    if(session&&session.access_token&&session.expires_at-now>60) return;
    if(session&&session.refresh_token){
      try{ saveSession(await authCall('/auth/v1/token?grant_type=refresh_token',{refresh_token:session.refresh_token})); return; }
      catch(e){ if(!(e.status>=400&&e.status<500)) throw e; /* refresh token rejected: start a fresh session */ }
    }
    session=null; store.set('off.sb.session',null);
    await signIn();
  }
  async function rest(method,path,body,extra){
    await ensure();
    const h2=Object.assign({apikey:SB_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},extra||{});
    const res=await fetch(SB_URL+'/rest/v1/'+path,{method,headers:h2,body:body==null?undefined:JSON.stringify(body)});
    const txt=await res.text();
    if(res.status===401&&session){ session.expires_at=0; }      // force a refresh (not a new identity) on the next call
    if(!res.ok) throw httpErr(res,txt);
    return txt?JSON.parse(txt):null;
  }

  function push(op){
    rev++;
    if(op.t==='clear') queue=[];
    else queue=queue.filter(q=>!(q.id===(op.t==='up'?op.row.id:op.id)));
    queue.push(op.t==='up'?{t:'up',id:op.row.id,row:op.row}:op);
    saveQueue();
    flush();
  }

  async function flush(){
    if(busy||!queue.length) return;
    busy=true; let retry401=0;
    try{
      while(queue.length){
        const op=queue[0];
        try{
          if(op.t==='up'){
            const batch=[]; for(const q of queue){ if(q.t!=='up'||batch.length>=50) break; batch.push(q); }
            await rest('POST',SB_TABLE+'?on_conflict=id',batch.map(q=>q.row),{Prefer:'resolution=merge-duplicates,return=minimal'});
            done(batch);
          } else if(op.t==='del'){
            await rest('DELETE',SB_TABLE+'?id=eq.'+encodeURIComponent(op.id),null,{Prefer:'return=minimal'});
            done([op]);
          } else {
            await rest('DELETE',SB_TABLE+'?user_id=eq.'+encodeURIComponent(session.user_id),null,{Prefer:'return=minimal'});
            done([op]);
          }
        }catch(e){
          if(e.status===401&&!e.auth&&++retry401<=2) continue;   // token went stale: ensure() renews it, retry the same op
          const drop=!e.auth&&e.status>=400&&e.status<500&&e.status!==401&&e.status!==408&&e.status!==429;
          if(drop){ done([op]); saveQueue(); continue; }       // a request the server will never accept must not block the rest
          throw e;                                                // network, server or sign-in trouble: keep the queue, try later
        }
        retry401=0;
        saveQueue();
      }
    }catch(e){ setState(stateFor(e)); }
    finally{ saveQueue(); busy=false; }
  }

  /* Reconcile with the server. Returns the server's list, or null if nothing should change locally. */
  async function sync(localItems){
    if(!SB_URL||!SB_KEY) return null;
    const startRev=rev;
    try{
      await ensure();
      if(store.get('off.sb.owner',null)!==session.user_id){
        // first run (or a brand-new session): copy whatever this browser already holds up to Supabase
        const known={}; queue.forEach(q=>{ if(q.id) known[q.id]=1; });
        (localItems||[]).forEach(i=>{ if(!known[i.id]) queue.push({t:'up',id:i.id,row:toRow(i)}); });
        saveQueue(); store.set('off.sb.owner',session.user_id);
      }
      await flush();
      if(queue.length||busy||rev!==startRev) return null;     // local changes still in flight: do not overwrite them
      const rows=await rest('GET',SB_TABLE+'?select=id,text,status,created_at&order=created_at.desc&limit=1000');
      if(rev!==startRev||queue.length) return null;
      setState('online'); lastSync=Date.now();
      return rows.map(fromRow);
    }catch(e){
      setState(stateFor(e));
      return null;
    }
  }

  return {push,sync,flush,get state(){return state;},get lastSync(){return lastSync;},sub(fn){subs.add(fn);return()=>subs.delete(fn);}};
})();

function useBox(){
  const [items,setItems]=useState(()=>{
    const v=store.get('off.box.v1',[]);
    return Array.isArray(v)?v.filter(i=>i&&typeof i.text==='string').map(i=>isUuid(i.id)?i:Object.assign({},i,{id:newId()})):[];
  });
  const ref=useRef(items); ref.current=items;
  const last=useRef(0);
  useEffect(()=>{store.set('off.box.v1',items)},[items]);
  const refresh=useCallback(force=>{
    if(!force&&Date.now()-last.current<15000) return;
    last.current=Date.now();
    BoxSync.sync(ref.current).then(r=>{ if(r) setItems(r); });
  },[]);
  useEffect(()=>{
    refresh(true);
    const vis=()=>{ if(document.visibilityState==='visible') refresh(false); };
    const back=()=>refresh(true);
    document.addEventListener('visibilitychange',vis); window.addEventListener('online',back);
    return()=>{ document.removeEventListener('visibilitychange',vis); window.removeEventListener('online',back); };
  },[]);
  return {
    items,
    add:text=>{
      const it={id:newId(),text,at:Date.now(),s:'open'};
      setItems(a=>[it].concat(a)); BoxSync.push({t:'up',row:toRow(it)});
    },
    setS:(id,s)=>{
      const cur=ref.current.find(i=>i.id===id);
      setItems(a=>a.map(i=>i.id===id?Object.assign({},i,{s}):i));
      if(cur) BoxSync.push({t:'up',row:toRow(Object.assign({},cur,{s}))});
    },
    purge:id=>{ setItems(a=>a.filter(i=>i.id!==id)); BoxSync.push({t:'del',id}); },
    clear:()=>{ setItems([]); BoxSync.push({t:'clear'}); }
  };
}

function useCloudState(){
  const [st,setSt]=useState(BoxSync.state);
  useEffect(()=>BoxSync.sub(setSt),[]);
  return st;
}

      h('p',null,'OFF is a relaxation and decompression tool. It is not medical care or therapy, it cannot diagnose or treat anything, and it is no substitute for professional help.'),
      h('p',null,'If you are struggling, please talk to a doctor, a qualified professional, or someone you trust.'),
      h('p',null,cs==='offline'
        ?'You are offline for now. My Box is saved in this browser and will catch up when the connection is back.'
        :cs==='unavailable'
          ?'Online saving is not available right now, so My Box is kept in this browser only.'
          :'My Box is saved privately online and tied to this browser. There is no account, and nobody else can open it.'),
      h('div',{className:'sheet-act'},
        sure
          ?[h('span',{key:'s',className:'sure'},'Empty My Box for good?'),h('button',{key:'y',className:'linkb sm',onClick:()=>{box.clear();setSure(false);}},'Yes, empty it'),h('button',{key:'n',className:'linkb sm',onClick:()=>setSure(false)},'Keep it')]
          :h('button',{className:'linkb sm faint',onClick:()=>setSure(true)},'Clear everything saved here'),
        h('button',{className:'pill sm solid',onClick:onClose},'Close'))));
}

/* ============ app: registry + root ============ */
const ESC={
  sky:{name:'Night sky',tone:'dark',bg:'#050818',hint:'Tap the sky.',Comp:NightSky},
  sand:{name:'Zen sand',tone:'light',bg:'#dccaa0',hint:'Drag to rake the sand.',Comp:Sand},
  bubbles:{name:'Bubble wrap',tone:'light',bg:'#c6d2f1',hint:'Pop them.',Comp:Bubbles},
  potato:{name:'The potato',tone:'light',bg:'#cfe0c6',hint:'Spin the potato.',Comp:Potato},
  duck:{name:'The duck',tone:'light',bg:'#d6ece8',hint:'Offer the duck something.',Comp:Duck},
  cloud:{name:'The grumpy cloud',tone:'light',bg:'#a9cbe8',hint:'Drag the cloud over the flowers.',Comp:Cloud},
  snowman:{name:'Tiny snowman',tone:'light',bg:'#d6e6f3',hint:'Drag the sun. Or don\'t.',Comp:Snowman},
  blob:{name:'The blob',tone:'light',bg:'#ecd9f2',hint:'Stretch the blob.',Comp:Blob},
  cat:{name:'The cat',tone:'light',bg:'#f2dcc8',hint:'Tap something on the table.',Comp:Cat},
  dragon:{name:'The sleepy dragon',tone:'dark',bg:'#0b0a14',hint:'Do not wake the dragon.',Comp:Dragon},
  cauldron:{name:'The cauldron',tone:'dark',bg:'#150f2a',hint:'Tap an ingredient.',Comp:Cauldron},
  fireflies:{name:'Fireflies',tone:'dark',bg:'#07151c',hint:'Hold your finger still.',Comp:Fireflies},
  campfire:{name:'Campfire',tone:'dark',bg:'#0a0b18',hint:'Tap to feed the fire.',Comp:Campfire},
  dandelion:{name:'Dandelion',tone:'light',bg:'#d3ebe0',hint:'Brush it. Or hold and blow.',Comp:Dandelion},
  leaves:{name:'Autumn wind',tone:'light',bg:'#f6cf9c',hint:'Drag to stir the leaves.',Comp:Leaves},
  aurora:{name:'Northern lights',tone:'dark',bg:'#050b1a',hint:'Drag the sky sideways.',Comp:Aurora},
  tower:{name:'The tower',tone:'light',bg:'#e6dcfa',hint:'Tap to drop the block.',Comp:Tower},
  plinko:{name:'Small pleasures',tone:'dark',bg:'#1d1440',hint:'Tap to drop a ball.',Comp:Plinko},
  stars:{name:'Connect the stars',tone:'dark',bg:'#070a22',hint:'Tap the glowing star.',Comp:Stars},
  sloth:{name:'Noughts and crosses',tone:'light',bg:'#dbe6c2',hint:'You are X. Take your time.',Comp:Sloth},
  pairs:{name:'Pairs',tone:'light',bg:'#f1ddd0',hint:'Find the matching pairs.',Comp:Pairs}
};
const ESC_IDS=Object.keys(ESC);

function App(){
  const box=useBox();
  const [view,setView]=useState('home'), [esc,setEsc]=useState(null), [about,setAbout]=useState(false);
  const recent=useRef([]);
  const nextEsc=useCallback(()=>{
    const c=ESC_IDS.filter(i=>recent.current.indexOf(i)<0), id=pick(c.length?c:ESC_IDS);
    recent.current=[id].concat(recent.current).slice(0,3); return id;
  },[]);
  const off=()=>{Snd.ensure(); setEsc(nextEsc()); setView('escape');};
  const home=()=>setView('home');
  let screen;
  if(view==='escape'&&esc) screen=h(Escape,{key:esc,id:esc,meta:ESC[esc],onLeave:home,onNext:()=>{Snd.ensure(); setEsc(nextEsc());}});
  else if(view==='put') screen=h(PutDown,{key:'put',box,go:setView});
  else if(view==='box') screen=h(MyBox,{key:'box',box,go:setView});
  else if(view==='done') screen=h(ImDone,{key:'done',box,go:setView});
  else screen=h(Home,{key:'home',go:setView,onOff:off,onAbout:()=>setAbout(true)});
  return h(React.Fragment,null,
    h('div',{className:'ambient','aria-hidden':'true'},h('i',{className:'orb o1'}),h('i',{className:'orb o2'})),
    screen,
    about&&h(About,{box,onClose:()=>setAbout(false)}));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
window.__OFF={ESC,ESC_IDS,Snd};

</script>
